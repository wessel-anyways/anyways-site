<title>anyways.</title>
<style>
:root{--paper:#FAFAF9;--ink:#111111;--red:#E8322B;--red-700:#B5221C;--g200:#D9D9D6;--g300:#B5B5B2;--g500:#6B6B69;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;padding:16px}
form{width:100%;max-width:360px}
.mark{font:800 32px/1 system-ui,-apple-system,sans-serif;letter-spacing:-.05em;margin-bottom:28px}
.mark i{font-style:normal;color:var(--red)}

input[type=password]{width:100%;font-size:17px;padding:12px 14px;border:1px solid var(--g300);border-radius:8px;background:#fff;color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--ink);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:14px;color:var(--g500)}
button{width:100%;font-size:16px;font-weight:700;padding:12px 14px;border:0;border-radius:8px;background:var(--ink);color:var(--paper);cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
#msg{min-height:22px;margin-top:12px;font-size:14px;color:var(--red-700)}
</style>
